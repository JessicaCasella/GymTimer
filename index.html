<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101211">
  <title>GymTimer</title>
  <link rel="stylesheet" href="style.css">

  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-QESFF09HL7"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag() { dataLayer.push(arguments); }
    gtag('js', new Date());

    gtag('config', 'G-QESFF09HL7');
  </script>
</head>

<body>

  <!-- HEADER -->
  <header class="header">

    <div class="logo" aria-label="GymTimer">
      <span class="brand-name">GYM<span>TIMER</span><span class="brand-dot">.</span></span>
      <span class="brand-caption">TU RITMO. TU ENTRENAMIENTO.</span>
    </div>

    <div class="top-controls">

      <button onclick="createTimer(420,'bike','CALENTAMIENTO 7 MIN')">
        CALENTAMIENTO 7 MIN
      </button>

      <button onclick="createTimer(600,'bike','CALENTAMIENTO 10 MIN')">
        CALENTAMIENTO 10 MIN
      </button>

      <button onclick="createGymCircuit()">
        CIRCUITO 15 MIN
      </button>

      <!--<button onclick="createPlankWorkout(4)">
        PLANCHAS x4 (1min)
      </button>

      <button onclick="createPlankWorkout(3)">
        PLANCHAS x3 (1min)
      </button>-->

      <button onclick="openPlankPanel()">
        PLANCHAS
      </button>

    </div>

  </header>



  <!-- LAYOUT PRINCIPAL -->
  <main class="layout">

    <!-- BARRA LATERAL DE TIEMPOS -->
    <div class="side-times" aria-label="Tiempos rápidos">
      <span class="section-label">TIEMPOS RÁPIDOS</span>

      <button onclick="createSecondsTimer(15)">15 SEG</button>
      <button onclick="createSecondsTimer(30)">30 SEG</button>
      <button onclick="createSecondsTimer(45)">45 SEG</button>

      <button onclick="createCustomTimer(1)">1 MIN</button>
      <button onclick="createCustomTimer(5)">5 MIN</button>
      <button onclick="createCustomTimer(10)">10 MIN</button>
      <button onclick="createCustomTimer(15)">15 MIN</button>
      <button onclick="createCustomTimer(20)">20 MIN</button>
      <button onclick="createCustomTimer(30)">30 MIN</button>
      <button onclick="createCustomTimer(45)">45 MIN</button>
      <button onclick="createCustomTimer(60)">1 HORA</button>

      <aside class="mobile-access" aria-label="Usar GymTimer en el móvil">
        <a href="https://jessicacasella.github.io/GymTimer/" aria-label="Abrir GymTimer en el móvil" target="_blank" rel="noopener noreferrer">
          <img src="gymtimer-qr.svg" width="132" height="132" alt="QR para abrir GymTimer en tu móvil">
        </a>
        <strong>ESCANEÁ Y USALO<br>DESDE TU MÓVIL</strong>
        <span>Tu timer, donde entrenes.</span>
      </aside>

    </div>


    <!-- TIMERS -->
    <div id="timers"></div>

  </main>



  <!-- BOTON TIMER PERSONALIZADO -->
  <div class="custom-creator">
    <button onclick="openCustomTimer()">
      TIMER PERSONALIZADO
    </button>
  </div>



  <!-- PANEL DE CREACION -->
  <div id="customPanel" class="custom-panel hidden">

    <div class="custom-time">

      <button onclick="changeMinutes(-1)">-</button>

      <span id="customMinutes">5</span>
      <span>MIN</span>

      <button onclick="changeMinutes(1)">+</button>

    </div>

    <button onclick="createSelectedTimer()">
      CREAR TIMER
    </button>

  </div>

  <div id="plankPanel" class="custom-panel hidden">

    <div class="custom-time">
      <label>Plancha (seg)</label>
      <input type="number" id="plankTime" value="60">
      <span onclick="closePlankPanel()" style="cursor:pointer;">✕</span>
    </div>

    <div class="custom-time">
      <label>Descanso (seg)</label>
      <input type="number" id="restTime" value="30">
    </div>

    <div class="custom-time">
      <label>Series</label>
      <input type="number" id="plankRounds" value="4">
    </div>

    <button onclick="startCustomPlank()">
      EMPEZAR
    </button>

  </div>



  <!-- FOOTER -->
  <footer class="footer">

    <a href="https://jessicacasella.pages.dev" target="_blank" rel="noopener noreferrer">
      Diseño &amp; desarrollo · JRC
    </a>

  </footer>


  <script src="app.js"></script>

</body>

</html>
